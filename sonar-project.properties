sonar.projectKey=ilm_go-sdk
sonar.organization=ilm

sonar.go.coverage.reportPaths=coverage.out

sonar.test.inclusions=**/*_test.go
# connector/model/** is OpenAPI-generated (gen.sh) and not hand-maintained:
# excluded from analysis entirely so regeneration cannot flood the quality
# gate with issues nobody would fix in generated code.
sonar.exclusions=connector/model/**
# Examples are documentation-grade usage demos and the codegen fixup tool is
# build tooling; neither is SDK surface whose coverage the gate should count.
sonar.coverage.exclusions=**/*_test.go,connector/model/**,connector/examples/**,tools/**
# Example scaffolding and the per-interface provider route tables repeat
# similar wiring by design.
sonar.cpd.exclusions=connector/model/**,connector/examples/**,connector/provider/*/v*/routes.go
